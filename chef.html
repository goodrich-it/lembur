<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porsi Lembur (Chef)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f5f8; color: #1d2433; }
    .card { max-width: 640px; margin: 24px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); text-align: center; }
    h1 { font-size: 18px; margin: 0; color: #475467; font-weight: 600; }
    .tgl { font-size: 20px; font-weight: 600; margin: 6px 0 0; }
    .angka { font-size: 112px; font-weight: 800; line-height: 1; margin: 18px 0 4px; color: #1f6feb; }
    .satuan { font-size: 20px; color: #475467; margin: 0 0 14px; }
    .upd { font-size: 13px; color: #98a2b3; margin: 10px 0 0; }
    .err { color: #b42318; font-size: 14px; }
    .tabs { display: flex; gap: 6px; justify-content: center; margin: 0 0 18px; }
    .tabs button { padding: 9px 18px; font-size: 15px; border: 1px solid #cfd5df; background: #fff; border-radius: 999px; cursor: pointer; }
    .tabs button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
    .we { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .we > div { flex: 1 1 200px; border: 1px solid #eef0f3; border-radius: 12px; padding: 16px 10px; }
    .we .angka { font-size: 84px; margin: 10px 0 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tabs">
      <button type="button" id="tabHari" class="on">Hari ini</button>
      <button type="button" id="tabWeekend">Weekend</button>
    </div>

    <section id="panelHari">
      <h1>Jumlah porsi lembur hari ini</h1>
      <p class="tgl" id="tgl">Memuat...</p>
      <div class="angka" id="angka">–</div>
      <p class="satuan">porsi</p>
    </section>

    <section id="panelWeekend" hidden>
      <h1>Porsi lembur weekend</h1>
      <div class="we">
        <div><p class="tgl" id="tglSabtu"></p><div class="angka" id="angkaSabtu">–</div><p class="satuan">porsi</p></div>
        <div><p class="tgl" id="tglMinggu"></p><div class="angka" id="angkaMinggu">–</div><p class="satuan">porsi</p></div>
      </div>
    </section>

    <p class="upd" id="upd"></p>
    <p class="err" id="err"></p>
  </main>

<script src="api.js"></script>
<script>
  var REFRESH_MS = 60000;
  var $ = function (id) { return document.getElementById(id); };

  function render(d) {
    $('tgl').textContent = d.hari + ', ' + d.tanggal;
    $('angka').textContent = d.jumlah;
    $('tglSabtu').textContent = 'Sabtu, ' + d.sabtu.tanggal;
    $('angkaSabtu').textContent = d.sabtu.jumlah;
    $('tglMinggu').textContent = 'Minggu, ' + d.minggu.tanggal;
    $('angkaMinggu').textContent = d.minggu.jumlah;
    $('upd').textContent = 'Diperbarui ' + d.diperbarui + ' WIB · otomatis tiap 60 detik';
  }

  function muat() {
    return apiGet({ api: 'chef' })
      .then(function (d) { $('err').textContent = ''; render(d); })
      .catch(function (e) { $('err').textContent = 'Gagal memuat data terbaru: ' + pesanError(e); });
  }

  function pilihTab(weekend) {
    $('tabHari').classList.toggle('on', !weekend);
    $('tabWeekend').classList.toggle('on', weekend);
    $('panelHari').hidden = weekend;
    $('panelWeekend').hidden = !weekend;
  }
  $('tabHari').onclick = function () { pilihTab(false); };
  $('tabWeekend').onclick = function () { pilihTab(true); };

  setInterval(muat, REFRESH_MS);
  var awalSelesai = muat();
</script>
</body>
</html>
